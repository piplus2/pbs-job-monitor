<?xml version="1.0" encoding="UTF-8"?>
<!-- 
PBS Job Monitor - Main Application Window Screenshot
Created programmatically as a visual mockup of the GUI
Dimensions: 800x620 pixels
-->
<svg width="800" height="620" viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="window-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f8fa"/>
      <stop offset="100%" stop-color="#f0f4f8"/>
    </linearGradient>
    <linearGradient id="button-green-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3db67c"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <linearGradient id="button-blue-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5dade2"/>
      <stop offset="100%" stop-color="#3498db"/>
    </linearGradient>
  </defs>
  
  <!-- Window Title Bar -->
  <rect x="0" y="0" width="800" height="45" fill="#2c3e50" rx="8" cy="10" r="8"/>
  
  <!-- Close button -->
  <circle cx="786" cy="24" r="12" fill="#e74c3c"/>
  <text x="786" y="29" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#ffffff">✕</text>
  
  <!-- Window Title -->
  <rect x="15" y="8" width="30" height="14"/>
  <text x="30" y="26" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="bold">PBS Job Monitor</text>
  
  <!-- Main Content Area Background -->
  <rect x="0" y="45" width="800" height="575" fill="url(#window-gradient)"/>
  
  <!-- Subtle background pattern -->
  <g opacity="0.1">
    <circle cx="25" cy="65" r="3" fill="#2c3e50"/>
    <circle cx="95" cy="120" r="4" fill="#2c3e50"/>
    <circle cx="170" cy="180" r="3" fill="#2c3e50"/>
    <circle cx="250" cy="140" r="5" fill="#2c3e50"/>
    <circle cx="340" cy="200" r="3" fill="#2c3e50"/>
    <circle cx="430" cy="170" r="4" fill="#2c3e50"/>
    <circle cx="520" cy="210" r="3" fill="#2c3e50"/>
    <circle cx="610" cy="190" r="4" fill="#2c3e50"/>
    <circle cx="700" cy="230" r="3" fill="#2c3e50"/>
  </g>
  
  <!-- Main Title -->
  <rect x="10" y="68" width="780" height="32" rx="8" fill="#d6eaf8" opacity="0.95"/>
  <text x="410" y="97" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#2c3e50" font-weight="bold">PBS Job Monitor</text>
  
  <!-- Input Field: Frontend IP/Hostname -->
  <rect x="18" y="92" width="764" height="28" rx="4" fill="#f0f2f5"/>
  <line x1="18" y1="108" x2="168" y2="108" stroke="#546e7a" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="178" y="105" font-family="Arial, sans-serif" font-size="13" fill="#546e7a">Frontend IP/Hostname:</text>
  
  <!-- Input Field: Username -->
  <rect x="18" y="126" width="764" height="28" rx="4" fill="#f0f2f5"/>
  <line x1="18" y1="142" x2="150" y2="142" stroke="#546e7a" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="160" y="139" font-family="Arial, sans-serif" font-size="13" fill="#546e7a">Username:</text>
  
  <!-- Input Field: Password -->
  <rect x="18" y="160" width="764" height="28" rx="4" fill="#f0f2f5"/>
  <line x1="18" y1="176" x2="200" y2="176" stroke="#546e7a" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="210" y="169" font-family="Arial, sans-serif" font-size="13" fill="#546e7a">Password:</text>
  
  <!-- Button: Save & Login (Green) -->
  <rect x="280" y="208" width="170" height="46" rx="8" fill="url(#button-green-gradient)">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Button highlight effect -->
  <ellipse cx="365" cy="234" rx="40" ry="8" fill="#ffffff" opacity="0.35" transform="translate(0, -4)"/>
  <text x="365" y="243" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">Save &amp; Login</text>
  
  <!-- Button: Load Saved Credentials (Blue) -->
  <rect x="465" y="208" width="170" height="46" rx="8" fill="url(#button-blue-gradient)">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Button highlight effect -->
  <ellipse cx="562" cy="234" rx="40" ry="8" fill="#ffffff" opacity="0.35" transform="translate(0, -4)"/>
  <text x="560" y="247" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff">Load Saved Credentials</text>
  
  <!-- Instructional Box -->
  <rect x="18" y="266" width="764" height="150" rx="12" fill="#e8f6f3"/>
  
  <!-- Instruction Text Line 1 -->
  <text x="28" y="305" font-family="Arial, sans-serif" font-size="15" fill="#16a085">Click "Save &amp; Login" to enter your PBS server credentials.</text>
  
  <!-- Instruction Text Line 2 -->
  <text x="28" y="340" font-family="Arial, sans-serif" font-size="15" fill="#16a085">Credentials are saved encrypted locally for quick access next time.</text>
  
  <!-- Footer Info -->
  <rect x="0" y="595" width="800" height="20" fill="#fafafa"/>
  <text x="400" y="605" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7f8c8d">PBS Job Monitor GUI • Encrypted credentials • Color-coded job states</text>
  
  <!-- Window Shadow -->
  <ellipse cx="400" cy="620" rx="250" ry="8" fill="#000000" opacity="0.12"/>
</svg>
